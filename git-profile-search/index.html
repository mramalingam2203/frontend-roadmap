<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Github Profile Search</h1>
    </div>
    <div class="search-container">
        <input type="text" placeholder="Search for a profile">
        <button>Search</button>
    </div>
    <div class="profile-container">
        <div class="profile">
            <img src="" alt="">
            <h2>Name</h2>
            <h3>Bio</h3>
            <h3>Location</h3>
            <h3>Followers</h3>
        </div>
    </div>
</body>
