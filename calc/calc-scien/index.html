<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
   <link rel="stylesheet"  href="css/style.css">
    <div class="container">
</head>
<body   
    
    <div>
        <script src = "./script.js"> </script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.0.1/math.min.js" integrity="sha512-B82WLflI1EQiR9sGbIV1ddGVvK4ghj1xjMShL7YvcOrHjX2qP72lHztT1DxBVPiz1aTR6mOUJbtwj06uadL2GA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <table id="calcu>
        <tr align = "center" > 
			<td colspan="10"><input type="text" id="result"></td> 
        </tr> 
        <tr>
            <td><input type="button" value="Rad" onclick="dis('1')" onkeydown="myFunction(event)""> </td> 
            <td><input type="button" value="Deg" onclick="dis('2')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="x!" onclick="dis('3')" onkeydown="myFunction(event)"> </td>
            <td><input type="button" value="(" onclick="dis('1')" onkeydown="myFunction(event)""> </td> 
            <td><input type="button" value=")" onclick="dis('2')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="%" onclick="dis('3')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="CE" onclick="dis('3')" onkeydown="myFunction(event)"> </td> 
        </tr>
        <tr>
            <td><input type="button" value="Inv" onclick="dis('4')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="sin" onclick="dis('5')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="ln" onclick="dis('6')" onkeydown="myFunction(event)"> </td>
            <td><input type="button" value="7" onclick="dis('4')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="8" onclick="dis('5')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="9" onclick="dis('6')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="&divide;" onclick="dis('3')" onkeydown="myFunction(event)"> </td> 
        </tr>
        <tr>
            <td><input type="button" value="&Pi;" onclick="dis('7')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="cos" onclick="dis('8')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="log" onclick="dis('9')" onkeydown="myFunction(event)"> </td>
            <td><input type="button" value="4" onclick="dis('4')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="5" onclick="dis('5')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="6" onclick="dis('6')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="&times" onclick="dis('3')" onkeydown="myFunction(event)"> </td> 
        </tr>
        <tr>
            <td><input type="button" value="0" onclick="dis('0')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="+" onclick="dis('+')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="-" onclick="dis('-')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="4" onclick="dis('4')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="5" onclick="dis('5')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="6" onclick="dis('6')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="3" onclick="dis('3')" onkeydown="myFunction(event)"> </td> 
        </tr>
        <tr>
            <td><input type="button" value="*" onclick="dis('*')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="/" onclick="dis('/')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="AC" onclick="clr()" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="4" onclick="dis('4')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="5" onclick="dis('5')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="6" onclick="dis('6')" onkeydown="myFunction(event)"> </td> 
            <td><input type="button" value="3" onclick="dis('3')" onkeydown="myFunction(event)"> </td> 
        </tr>
        
      </table> 
    </div>

  
</div>
</body>
</html>
