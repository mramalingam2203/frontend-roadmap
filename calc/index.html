<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet"  href="css/style.css">
    <div class="container">
    <div>
        
    </div>
    <div>
    <table>
        <tr> 
            <td colspan="3"><input type="text" id="result"></td> 
        </tr> 
        <tr>
          <td><button class="button" id = "num1">1</button></td>
          <td><button class="button" id = "num2">2</button></td>
          <td><button class="button" id = "num3">3</button></td>
        </tr>
        <tr>
            <td><button class="button" id = "num4">4</button></td>
            <td><button class="button" id = "num5">5</button></td>
            <td><button class="button" id = "num6">6</button></td>
        </tr>
        <tr>
            <td><button class="button" id = "num7">7</button></td>
            <td><button class="button" id = "num8">8</button></td>
            <td><button class="button" id = "num9">9</button></td>
        </tr>
        <tr>
            <td><button class="button" id = "num0">0</button></td>
            <td><button class="button" id = "add">+</button></td>
            <td><button class="button" id = "sub">-</button></td>
        </tr>
        <tr>
            <td><button class="button" id = "mult">*</button></td>
            <td><button class="button" id = "div">/</button></td>
            <td><button class="button" id = "erase">AC</button></td>
        </tr>
        <tr>
            <td><button class="button" id = "dec">.</button></td>
            <td><button class="button" id = "eq">=</button></td>
            <td><button class="button" id = ""></button></td>
        </tr>
      </table> 
    </div>
</div>
</head>
