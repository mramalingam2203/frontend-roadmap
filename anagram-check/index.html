<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Anagram Checker — Bold Big CSS</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#7c3aed;
      --text:#e6eef8;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial}

    /* Center everything vertically & horizontally */
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg,#071022 0%, var(--bg) 100%);
      color:var(--text);
      padding:24px;
    }

    /* card look */
    .card{
      width:min(920px, 95%);
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.08));
      border:1px solid rgba(255,255,255,0.04);
      border-radius:18px;
      padding:36px;
      box-shadow: 0 8px 40px rgba(2,6,23,0.7);
      text-align:center;
    }

    h1{
      margin:0 0 20px 0;
      font-size:clamp(28px, 5vw, 44px);
      letter-spacing:-0.02em;
      font-weight:800; /* bold */
    }

    p.lead{
      margin:0 0 26px 0;
      font-size:clamp(14px,2.2vw,18px);
      opacity:0.85;
    }

    /* big, bold inputs placed side-by-side on wide screens */
    .inputs{
      display:flex;
      gap:18px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:22px;
    }

    input[type="text"]{
      appearance:none;
      border-radius:12px;
      border:2px solid rgba(255,255,255,0.06);
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));
      padding:20px 22px;
      width:420px;
      max-width:100%;
      font-size:clamp(20px,4vw,30px); /* big text */
      font-weight:800; /* bold text inside */
      color:var(--text);
      outline:none;
      transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
      text-align:center;
    }
    input[type="text"]::placeholder{opacity:0.6;font-weight:600}

    input[type="text"]:focus{
      transform:translateY(-3px);
      box-shadow:0 10px 30px rgba(124,58,237,0.12);
      border-color: rgba(124,58,237,0.9);
    }

    .controls{
      display:flex;
      gap:12px;
      justify-content:center;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    button{
      border:0;
      padding:14px 22px;
      border-radius:12px;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
      background:linear-gradient(90deg,var(--accent), #5b21b6);
      color:white;
      box-shadow: 0 8px 20px rgba(124,58,237,0.18);
      transition:transform .12s ease, opacity .12s ease;
    }
    button.secondary{
      background:transparent;
      border:1px solid rgba(255,255,255,0.06);
      color:var(--text);
      font-weight:700;
      box-shadow:none;
    }
    button:active{transform:translateY(2px)}

    .result{
      margin-top:8px;
      font-size:clamp(18px,3.5vw,26px);
      font-weight:900;
      letter-spacing:0.01em;
      min-height:36px;
    }

    .result.ok{color:#4ade80} /* green */
    .result.bad{color:#fb7185} /* red */

    /* small help text */
    .hint{
      margin-top:12px;
      font-size:13px;
      opacity:0.75;
    }

    /* Responsive tweaks */
    @media (max-width:640px){
      input[type="text"]{padding:16px;font-size:20px}
      .card{padding:20px;border-radius:14px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-labelledby="title">
      <h1 id="title">Anagram Checker</h1>
      <p class="lead">Type two phrases (punctuation & spaces ignored). Bold & big UI — centered for quick checks.</p>

      <div class="inputs">
        <input id="a" type="text" placeholder="First text" aria-label="First text" />
        <input id="b" type="text" placeholder="Second text" aria-label="Second text" />
      </div>

      <div class="controls">
        <button id="check">Check Anagram</button>
        <button id="clear" class="secondary">Clear</button>
      </div>

 
    </div>
  </div>

  <script>
    const a = document.getElementById('a');
    const b = document.getElementById('b');
    const res = document.getElementById('result');
    const check = document.getElementById('check');
    const clear = document.getElementById('clear');

    function normalize(s){
      return s
        .toLowerCase()
        .replace(/[^a-z0-9]/g,'') // remove non-alphanumeric
        .split('')
        .sort()
        .join('');
    }

    function isAnagram(s,t){
      return normalize(s) === normalize(t) && normalize(s).length>0;
    }

    check.addEventListener('click', ()=>{
      const va = a.value || '';
      const vb = b.value || '';
      if(va.trim()==='' || vb.trim()===''){
        res.textContent = 'Enter text in both boxes.';
        res.className = 'result bad';
        return;
      }
      if(isAnagram(va,vb)){
        res.textContent = '✅ Anagrams!';
        res.className = 'result ok';
      } else {
        res.textContent = '❌ Not anagrams';
        res.className = 'result bad';
      }
    });

    clear.addEventListener('click', ()=>{
      a.value=''; b.value=''; res.textContent=''; a.focus();
    });

    // Optional: allow Enter key to trigger check when focused in inputs
    [a,b].forEach(el=>el.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter') check.click();
    }));
    


   
  </script>
</body>
</html>
